spring.application.name=trello-clone
server.port=8080

# --- MySQL Database Configuration ---
# 1. We point to the "trello_db" we created
spring.datasource.url=jdbc:mysql://localhost:3306/trello_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

# 2. Your Credentials (CHANGE THESE IF YOUR PASSWORD IS DIFFERENT)
spring.datasource.username=root
spring.datasource.password=password

# 3. The Driver (Translator)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
# Update the schema if classes change
spring.jpa.hibernate.ddl-auto=update
# Show SQL in console (helpful for debugging)
spring.jpa.show-sql=true
# Use the correct dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Swagger Config ---
springdoc.packages-to-scan=com.taskfellow.trello_clone

# --- Security Configuration ---
jwt.secret=my_super_secure_secret_key_that_is_at_least_32_chars_long_12345

# --- File Upload Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB